# Runs the whole app:  docker compose up --build
#   web   http://localhost:3000
#   api   http://localhost:4000
# Secrets (OPENAI_API_KEY, GOOGLE_*, META_*, CONNECTOR_ENCRYPTION_KEY, ...) are read from apps/api/.env.local at runtime
# and are never baked into an image. Ports are bound to 127.0.0.1 because the app has no user login yet.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: apps/api/.env.local
        required: false
    environment:
      # These override anything in .env.local, so a localhost URL there cannot break the container.
      PORT: "4000"
      DATABASE_URL: /data/local.db
      REDIS_URL: redis://redis:6379
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Load sample data once so the dashboard is not empty. Set to false to start blank.
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - api-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WORKSPACE_ID: ${NEXT_PUBLIC_WORKSPACE_ID:-ws_demo}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  api-data:
